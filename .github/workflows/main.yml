name: Criar e implantar localmente

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          # Verifique se o nome do secret no GitHub está EXATAMENTE assim
          username: ${{ secrets.DOKERHUB_USE }}
          password: ${{ secrets.DOCKERHUB_PASSWOR }}

      - name: Build e push da imagem
        run: |
          docker build -t elivandrolopes/portaria:7.0 .
          docker push elivandrolopes/portaria:7.0

  deploy:
    needs: build
    runs-on: [self-hosted, Linux]
    steps:
      - name: Deploy local com Docker Compose
        run: |
          # Caminho absoluto para o diretório onde está o seu docker-compose.yml
          cd /servidor/servidor
          docker compose pull portaria-app
          docker compose up -d portaria-app
